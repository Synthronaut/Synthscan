name: Automatic signed update channel
on:
  workflow_dispatch:
concurrency:
  group: synthscan-update-channel
  cancel-in-progress: false
permissions:
  contents: read
jobs:
  engines:
    runs-on: windows-2022
    strategy:
      fail-fast: false
      matrix:
        edition: [standard, full]
    env:
      SYNTHSCAN_EDITION: ${{ matrix.edition }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'
          architecture: x64
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: ui/package-lock.json
      - run: python -m pip install --require-hashes -r requirements-release.lock
      - name: Compute monotonic update version and sequence
        run: python -B tools/compute_update_version.py
      - name: Build and verify TypeScript desktop UI
        run: |
          npm --prefix ui ci
          npm --prefix ui test
          npm --prefix ui run build
      - run: python -B tools/fetch_build_dependencies.py
      - run: python -B tools/build_native_app.py
      - name: Native engine and WebView2 500-player roster checks
        shell: python
        run: |
          import json, os, subprocess, tempfile
          from pathlib import Path
          with tempfile.TemporaryDirectory(prefix='SynthScan-native-selftest-', ignore_cleanup_errors=True) as profile:
              env = dict(os.environ, SYNTHSCAN_DATA_DIR=profile, BEDROCK_DATA_DIR=profile)
              result = subprocess.run(['dist/native/SynthScan.exe', '--selftest'], env=env, capture_output=True, text=True, timeout=180)
              output = result.stdout + result.stderr
              Path('native-selftest.log').write_text(output, encoding='utf-8')
              print(output, flush=True)
              result.check_returncode()
          with tempfile.TemporaryDirectory(prefix='SynthScan-webview-preview-', ignore_cleanup_errors=True) as wv_dir:
              wv = subprocess.run(['dist/native/SynthScan.exe', '--webview-preview', wv_dir], capture_output=True, text=True, timeout=120)
              wv.check_returncode()
              report = json.loads((Path(wv_dir) / 'webview_validation.json').read_text(encoding='utf-8'))
              if not (report.get('suite_500_roster_passed') and report.get('forged_and_unconfirmed_rejected') and report.get('authenticated_stage_routed')):
                  raise RuntimeError('WebView2 validation failed: ' + json.dumps(report))
      - name: Real workspace responsiveness and People interactions
        run: python -B tools/verify_companion_responsiveness.py
      - name: Python regression suite
        run: python -B -m unittest discover -s tests -q
      - name: Assemble verified intermediate engine payload
        run: python -B tools/package_community.py --edition ${{ matrix.edition }} --source out/source --package out/SynthScan-${{ matrix.edition }}-engine --native dist/native
      - uses: actions/upload-artifact@v4
        with:
          name: update-engine-${{ matrix.edition }}
          path: out/SynthScan-${{ matrix.edition }}-engine.zip
  assemble_and_verify:
    needs: engines
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'
          architecture: x64
      - run: python -m pip install --require-hashes -r requirements-release.lock
      - name: Compute monotonic update version and sequence
        run: python -B tools/compute_update_version.py
      - uses: actions/download-artifact@v4
        with:
          pattern: update-engine-*
          merge-multiple: true
          path: out/engines
      - name: Build signed feature packages
        env:
          SYNTHSCAN_SIGNING_PRIVATE_B64: ${{ secrets.SYNTHSCAN_SIGNING_PRIVATE_B64 }}
        shell: pwsh
        run: |
          if (-not $env:SYNTHSCAN_SIGNING_PRIVATE_B64) { throw 'Configure the protected release-signing secret first.' }
          Expand-Archive out/engines/SynthScan-standard-engine.zip out/standard
          Expand-Archive out/engines/SynthScan-full-engine.zip out/full
          $version = (Get-Content out/standard/SynthScan/release.json | ConvertFrom-Json).version
          python -B tools/package_modules.py --standard out/standard/SynthScan --full out/full/SynthScan --output out/modules --url-base "https://github.com/Synthronaut/Synthscan/releases/download/v$version"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Validate isolated packaged selections
        run: python -B tools/verify_modules.py --payload out/modules --output out/module-validation.json
      - name: Verify installed feature controls and rendered HUDs
        run: python -B tools/verify_runtime_modules.py --standard out/standard/SynthScan/dist/native --full out/full/SynthScan/dist/native --output out/runtime-modules
      - name: Verify isolated update staging, data preservation, and rollback
        run: python -B tools/verify_auto_update.py --output out/auto-update-validation.json
      - name: Build migration update packages
        env:
          SYNTHSCAN_SIGNING_PRIVATE_B64: ${{ secrets.SYNTHSCAN_SIGNING_PRIVATE_B64 }}
        shell: pwsh
        run: |
          python -B tools/package_modular_updates.py --payload out/modules --output out/migration
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          New-Item -ItemType Directory out/signed | Out-Null
          $version = (Get-Content out/modules/core/release.json | ConvertFrom-Json).version
          foreach ($edition in @('standard','full')) {
            $file = "SynthScan-$edition-Windows-x64.zip"
            python -B tools/sign_release.py --archive "out/migration/$file" --url "https://github.com/Synthronaut/Synthscan/releases/download/v$version/$file" --output "out/signed/synthscan-update-$edition.json"
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }
      - uses: actions/upload-artifact@v4
        with:
          name: SynthScan-update-only-release
          path: |
            out/modules/*.zip
            out/modules/synthscan-modules.json
            out/modules/module-build-report.json
            out/migration/*.zip
            out/migration/*.sha256
            out/signed/*.json
            out/module-validation.json
            out/auto-update-validation.json
            out/runtime-modules/validation.json
  publish_update_channel:
    needs: assemble_and_verify
    runs-on: windows-2022
    environment: community-release
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: SynthScan-update-only-release
          path: out
      - name: Publish immutable update assets then promote signed update-channel manifests last
        env:
          GH_TOKEN: ${{ github.token }}
        shell: pwsh
        run: |
          $manifestFile = Get-ChildItem out -Recurse -Filter synthscan-update-full.json | Select-Object -First 1
          $envelope = Get-Content $manifestFile.FullName | ConvertFrom-Json
          $manifest = [Text.Encoding]::UTF8.GetString([Convert]::FromBase64String($envelope.payload)) | ConvertFrom-Json
          $tag = 'v' + $manifest.version
          $assets = @(Get-ChildItem out -Recurse -File | ForEach-Object { $_.FullName })
          gh release create $tag @assets --repo Synthronaut/Synthscan --target '${{ github.sha }}' --title "SynthScan $($manifest.version) — Signed Update" --notes "Automated signed module and application update for commit ${{ github.sha }}." --draft
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $releases = gh api 'repos/Synthronaut/Synthscan/releases?per_page=100' | ConvertFrom-Json
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $drafts = @($releases | Where-Object { $_.tag_name -eq $tag -and $_.draft -and $_.target_commitish -eq '${{ github.sha }}' })
          if ($drafts.Count -ne 1) { throw 'Expected exactly one draft for this verified commit' }
          $release = $drafts[0]
          foreach ($file in $assets) {
            $name = [IO.Path]::GetFileName($file)
            $asset = @($release.assets | Where-Object { $_.name -eq $name })
            $sha = (Get-FileHash -LiteralPath $file -Algorithm SHA256).Hash.ToLowerInvariant()
            if ($asset.Count -ne 1 -or $asset[0].digest -ne "sha256:$sha") { throw "Draft upload integrity check failed: $name" }
          }
          gh api --method PATCH "repos/Synthronaut/Synthscan/releases/$($release.id)" -F draft=false -f make_latest=false | Out-Null
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Copy-Item $manifestFile.FullName out/synthscan-update.json
          $standard = (Get-ChildItem out -Recurse -Filter synthscan-update-standard.json | Select-Object -First 1).FullName
          $modules = (Get-ChildItem out -Recurse -Filter synthscan-modules.json | Select-Object -First 1).FullName
          gh release upload update-channel out/synthscan-update.json $standard $modules --repo Synthronaut/Synthscan --clobber
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
